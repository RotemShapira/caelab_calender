{% extends "base.html" %}
{% block title %}Sign In — Lab Scheduler{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4">
            <h4 class="mb-2">🔐 Lab Member Sign In</h4>
            <p class="text-muted small mb-3">Sign in with the username and password provided by the lab admin.</p>

            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required autofocus
                           maxlength="120" value="{{ username or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">Sign In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
