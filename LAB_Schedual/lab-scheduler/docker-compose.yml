services:
  lab-scheduler:
    build: .
    container_name: lab-scheduler
    restart: unless-stopped
    ports:
      # Host port : Container port. Change the left side if 8000 is taken
      # on your TrueNAS box (e.g. "8090:8000").
      - "8001:8000"
    environment:
      # --- Admin login (HTTP Basic Auth on /admin) ---
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "changeme"          # CHANGE THIS before exposing beyond localhost

      # --- Optional webhook notification (Slack/Discord/n8n/Home Assistant) ---
      WEBHOOK_URL: ""                     # e.g. https://hooks.slack.com/services/xxx

      # --- Optional email notification (leave blank to disable) ---
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      NOTIFY_EMAIL_TO: ""                 # comma-separated admin emails

      # --- Database location inside the container (matches the volume below) ---
      DATABASE_URL: "sqlite:////app/data/lab_scheduler.db"

      # --- Auto-purge denied bookings after this many days (default 30) ---
      DENIED_RETENTION_DAYS: "30"
    volumes:
      # Persist the SQLite DB across container rebuilds/updates.
      # On TrueNAS SCALE, point this at a dataset, e.g.:
      #   /mnt/<pool>/apps/lab-scheduler/data:/app/data
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
